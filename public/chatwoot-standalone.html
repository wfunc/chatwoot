<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title></title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f4f5;
    }

    body[data-ready="true"] #loading,
    body[data-error="true"] #loading {
      display: none;
    }

    body[data-ready="true"] #chatwoot-frame {
      display: block;
    }

    body[data-error="true"] #error {
      display: flex;
    }

    #chatwoot-frame {
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }

    #loading,
    #error {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 24px;
    }

    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #27272a;
      font-size: 14px;
    }

    #error {
      display: none;
      align-items: center;
      justify-content: center;
      color: #b91c1c;
      font-size: 14px;
      text-align: center;
      white-space: pre-line;
    }
  </style>
</head>

<body>
  <div id="loading">connecting...</div>
  <div id="error"></div>
  <iframe id="chatwoot-frame" title=""
    allow="camera;microphone;fullscreen;display-capture;picture-in-picture;clipboard-write;"></iframe>

  <script>
    (function init() {
      var params = new URLSearchParams(window.location.search);
      var embeddedDefaults = window.__CHATWOOT_STANDALONE_DEFAULTS__ || {};
      var baseUrl =
        readParam(params, ['baseurl', 'baseUrl', 'base_url']) ||
        embeddedDefaults.baseUrl ||
        embeddedDefaults.base_url ||
        '';
      var websiteToken = readParam(params, [
        'token',
        'websiteToken',
        'websitetoken',
        'website_token',
        'entid',
        'eid',
      ]) || embeddedDefaults.websiteToken || embeddedDefaults.website_token || '';
      var useBrowserLanguage =
        readParam(params, ['languagelocal', 'languageLocal']) === 'true';
      var locale = useBrowserLanguage
        ? normalizeLocale(window.navigator.language)
        : normalizeLocale(readParam(params, ['locale', 'language', 'lang']));
      var conversationToken = readParam(params, [
        'cw_conversation',
        'conversation',
        'conversationToken',
      ]);
      var autoStart = readParam(params, ['autostart', 'autoStart']) !== 'false';
      var standaloneMode =
        readParam(params, ['standalone', 'standaloneMode']) !== 'false';
      var route = normalizeRoute(
        readParam(params, ['route']) || (autoStart ? 'messages' : 'home')
      );
      var title = readParam(params, ['title']) || '';
      var backgroundColor = normalizeColor(
        readParam(params, ['backgroundcolor', 'backgroundColor', 'bgcolor'])
      );
      var backgroundImage = readParam(params, [
        'backgroundimage',
        'backgroundImage',
        'bgimage',
      ]);
      var labelParam = readParam(params, ['labels', 'label']);
      var labels = parseList(labelParam);
      var identifier =
        readParam(params, ['clientid', 'clientId', 'identifier']) || '';
      var identityKey = buildIdentityKey(params, identifier);
      var metadata = parseJson(readParam(params, ['metadata']));
      var encryptedMetadata = readParam(params, [
        'encryptedmetadata',
        'encryptedMetadata',
      ]);
      var customAttributes = parseJson(
        readParam(params, [
          'customattributes',
          'customAttributes',
          'contactcustomattributes',
          'contactCustomAttributes',
        ])
      );
      var conversationCustomAttributes = parseJson(
        readParam(params, [
          'conversationcustomattributes',
          'conversationCustomAttributes',
          'conversationmetadata',
          'conversationMetadata',
        ])
      );
      var frame = document.getElementById('chatwoot-frame');
      var targetOrigin;
      var returnUrl = getReturnUrl(params);

      document.title = title;

      if (backgroundColor) {
        document.body.style.backgroundColor = backgroundColor;
      }

      if (backgroundImage) {
        document.body.style.backgroundImage = 'url("' + backgroundImage + '")';
        document.body.style.backgroundRepeat = 'no-repeat';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundSize = 'cover';
      }

      if (!baseUrl || !websiteToken) {
        showError(
          '缺少必要参数。\n请至少传入 baseUrl 和 websiteToken。\n\n示例：\nchatwoot-standalone.html?baseUrl=https://chat.example.com&websiteToken=YOUR_TOKEN'
        );
        return;
      }

      targetOrigin = new URL(baseUrl).origin;

      var widgetUrl = new URL(baseUrl.replace(/\/+$/, '') + '/widget');
      widgetUrl.searchParams.set('website_token', websiteToken);

      if (locale) {
        widgetUrl.searchParams.set('locale', locale);
      }

      var persistedConversationToken = conversationToken;
      var conversationStorageKey = getConversationStorageKey(
        targetOrigin,
        websiteToken,
        identityKey
      );

      if (!persistedConversationToken) {
        persistedConversationToken = readStoredConversationToken(
          conversationStorageKey
        );
      }

      if (persistedConversationToken) {
        widgetUrl.searchParams.set(
          'cw_conversation',
          persistedConversationToken
        );
      }

      if (standaloneMode) {
        widgetUrl.searchParams.set('standalone', 'true');
      }

      if (returnUrl) {
        widgetUrl.searchParams.set('return_url', returnUrl);
      }

      copyParam(params, widgetUrl, ['name', 'fullName']);
      copyParam(params, widgetUrl, ['email']);
      copyParam(params, widgetUrl, [
        'phone',
        'phoneNumber',
        'phone_number',
      ]);

      widgetUrl.hash = '#/' + route;
      registerConversationPersistence(
        frame,
        targetOrigin,
        conversationStorageKey
      );
      registerReturnUrlRedirect(targetOrigin, returnUrl);
      frame.src = widgetUrl.toString();
      frame.onload = function onLoad() {
        document.body.dataset.ready = 'true';
        hydrateWidget(frame, targetOrigin, {
          params: params,
          identifier: identifier,
          metadata: metadata,
          encryptedMetadata: encryptedMetadata,
          labels: labels,
          customAttributes: customAttributes,
          conversationCustomAttributes: conversationCustomAttributes,
          locale: locale,
        });
      };
    })();

    function readParam(params, keys) {
      for (var index = 0; index < keys.length; index += 1) {
        var value = params.get(keys[index]);
        if (value) {
          return value;
        }
      }
      return '';
    }

    function copyParam(params, targetUrl, keys) {
      for (var index = 0; index < keys.length; index += 1) {
        var key = keys[index];
        var value = params.get(key);
        if (value) {
          targetUrl.searchParams.set(key, value);
          return;
        }
      }
    }

    function buildIdentityKey(params, identifier) {
      return (
        identifier ||
        readFromParams(params, ['email']) ||
        readFromParams(params, ['phone', 'phoneNumber', 'phone_number']) ||
        readFromParams(params, ['name', 'fullName']) ||
        'anonymous'
      );
    }

    function getConversationStorageKey(targetOrigin, websiteToken, identityKey) {
      return [
        'chatwootStandaloneConversation',
        targetOrigin,
        websiteToken,
        identityKey,
      ].join(':');
    }

    function readStoredConversationToken(storageKey) {
      return (
        readValidStoredConversationToken(window.localStorage, storageKey) ||
        readValidStoredConversationToken(window.sessionStorage, storageKey)
      );
    }

    function storeConversationToken(storageKey, token) {
      var normalizedToken = normalizeConversationToken(token);
      if (!normalizedToken) {
        return;
      }

      writeToStorage(window.localStorage, storageKey, normalizedToken);
      writeToStorage(window.sessionStorage, storageKey, normalizedToken);
    }

    function readFromStorage(storage, key) {
      try {
        return storage && storage.getItem(key);
      } catch (error) {
        return '';
      }
    }

    function writeToStorage(storage, key, value) {
      try {
        if (storage && value) {
          storage.setItem(key, value);
        }
      } catch (error) {
        // Ignore storage errors for private browsing and restrictive environments.
      }
    }

    function removeFromStorage(storage, key) {
      try {
        if (storage) {
          storage.removeItem(key);
        }
      } catch (error) {
        // Ignore storage errors for private browsing and restrictive environments.
      }
    }

    function readValidStoredConversationToken(storage, key) {
      var token = normalizeConversationToken(readFromStorage(storage, key));

      if (!token) {
        removeFromStorage(storage, key);
      }

      return token;
    }

    function normalizeConversationToken(token) {
      if (typeof token !== 'string') {
        return '';
      }

      var normalized = token.trim();

      if (!normalized || normalized === '[object Object]') {
        return '';
      }

      if (!/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(normalized)) {
        return '';
      }

      return normalized;
    }

    function registerConversationPersistence(frame, targetOrigin, storageKey) {
      window.addEventListener('message', function onMessage(event) {
        if (event.origin !== targetOrigin) {
          return;
        }

        if (
          typeof event.data !== 'string' ||
          event.data.indexOf('chatwoot-widget:') !== 0
        ) {
          return;
        }

        var message = JSON.parse(
          event.data.replace('chatwoot-widget:', '')
        );
        var conversationToken =
          readNestedValue(message, ['config', 'authToken']) ||
          readNestedValue(message, ['data', 'widgetAuthToken']);

        if (conversationToken) {
          storeConversationToken(storageKey, conversationToken);
        }
      });
    }

    function registerReturnUrlRedirect(targetOrigin, returnUrl) {
      if (!returnUrl) {
        return;
      }

      window.history.pushState(
        { chatwootStandaloneReturnIntercept: true },
        '',
        window.location.href
      );

      window.addEventListener('popstate', function onPopstate() {
        window.location.replace(returnUrl);
      });

      window.addEventListener('message', function onMessage(event) {
        if (event.origin !== targetOrigin) {
          return;
        }

        if (
          typeof event.data !== 'string' ||
          event.data.indexOf('chatwoot-widget:') !== 0
        ) {
          return;
        }

        var message = parseWidgetMessage(event.data);
        if (!message || message.event !== 'returnToUrl') {
          return;
        }

        window.location.assign(
          normalizeReturnUrl(message.returnUrl) || returnUrl
        );
      });
    }

    function parseWidgetMessage(data) {
      try {
        return JSON.parse(data.replace('chatwoot-widget:', ''));
      } catch (error) {
        return {};
      }
    }

    function normalizeRoute(route) {
      var normalized = String(route || '')
        .replace(/^#?\/?/, '')
        .trim();

      if (!normalized) {
        return 'messages';
      }

      return normalized;
    }

    function getReturnUrl(params) {
      return normalizeReturnUrl(
        readParam(params, ['return_url', 'returnUrl', 'back_url', 'backUrl']) ||
          document.referrer
      );
    }

    function normalizeReturnUrl(returnUrl) {
      if (!returnUrl) {
        return '';
      }

      try {
        var parsedUrl = new URL(returnUrl, window.location.href);
        var currentUrl = new URL(window.location.href);

        if (!['http:', 'https:'].includes(parsedUrl.protocol)) {
          return '';
        }

        if (
          parsedUrl.origin === currentUrl.origin &&
          parsedUrl.pathname === currentUrl.pathname
        ) {
          return '';
        }

        return parsedUrl.toString();
      } catch (error) {
        return '';
      }
    }

    function normalizeLocale(locale) {
      var normalized = String(locale || '').trim();
      if (!normalized) {
        return '';
      }

      var aliases = {
        cn: 'zh_CN',
        jp: 'ja',
        tw: 'zh_TW',
      };

      var lowered = normalized.toLowerCase();
      return aliases[lowered] || normalized.replace('-', '_');
    }

    function parseJson(value) {
      if (!value) {
        return {};
      }

      try {
        var parsed = JSON.parse(value);
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch (error) {
        return {};
      }
    }

    function parseList(value) {
      if (!value) {
        return [];
      }

      if (value.trim().charAt(0) === '[') {
        try {
          var parsed = JSON.parse(value);
          return Array.isArray(parsed) ? parsed.filter(Boolean) : [];
        } catch (error) {
          return [];
        }
      }

      return value
        .split(',')
        .map(function mapLabel(item) {
          return item.trim();
        })
        .filter(Boolean);
    }

    function sendWidgetMessage(frame, targetOrigin, event, payload) {
      frame.contentWindow.postMessage(
        'chatwoot-widget:' +
        JSON.stringify(Object.assign({ event: event }, payload || {})),
        targetOrigin || '*'
      );
    }

    function hydrateWidget(frame, targetOrigin, context) {
      var metadata = Object.assign({}, context.metadata);
      var customAttributes = Object.assign({}, context.customAttributes);
      var conversationCustomAttributes = Object.assign(
        {},
        context.conversationCustomAttributes
      );
      var user = buildUserPayload(context.params, metadata);

      if (context.params.get('subsource')) {
        customAttributes.sub_source = context.params.get('subsource');
        conversationCustomAttributes.sub_source =
          context.params.get('subsource');
      }

      if (context.params.get('greeting')) {
        conversationCustomAttributes.greeting = context.params.get('greeting');
      }

      if (context.params.get('agentid')) {
        conversationCustomAttributes.preferred_agent_token =
          context.params.get('agentid');
      }

      if (context.params.get('groupid')) {
        conversationCustomAttributes.preferred_group_token =
          context.params.get('groupid');
      }

      if (context.params.get('fallback')) {
        conversationCustomAttributes.fallback = context.params.get('fallback');
      }

      if (context.params.get('socketprotocol')) {
        conversationCustomAttributes.socket_protocol =
          context.params.get('socketprotocol');
      }

      if (context.encryptedMetadata) {
        customAttributes.encrypted_metadata = context.encryptedMetadata;
      }

      Object.assign(customAttributes, metadata.custom_attributes || {});
      Object.assign(
        conversationCustomAttributes,
        metadata.conversation_custom_attributes || {}
      );

      delete metadata.custom_attributes;
      delete metadata.conversation_custom_attributes;

      customAttributes = Object.assign(customAttributes, metadata);

      window.setTimeout(function sendInitialMessages() {
        if (context.locale) {
          sendWidgetMessage(frame, targetOrigin, 'set-locale', {
            locale: context.locale,
          });
        }

        if (context.identifier) {
          sendWidgetMessage(frame, targetOrigin, 'set-user', {
            identifier: context.identifier,
            user: user,
          });
        } else if (Object.keys(user).length) {
          sendWidgetMessage(frame, targetOrigin, 'update-user', {
            user: user,
          });
        }

        if (Object.keys(customAttributes).length) {
          sendWidgetMessage(frame, targetOrigin, 'set-custom-attributes', {
            customAttributes: customAttributes,
          });
        }

        if (Object.keys(conversationCustomAttributes).length) {
          sendWidgetMessage(
            frame,
            targetOrigin,
            'set-conversation-custom-attributes',
            {
              customAttributes: conversationCustomAttributes,
            }
          );
        }

        context.labels.forEach(function applyLabel(label) {
          sendWidgetMessage(frame, targetOrigin, 'set-label', {
            label: label,
          });
        });
      }, 500);
    }

    function buildUserPayload(params, metadata) {
      var payload = {};
      var mappings = [
        [['name'], 'name'],
        [['email'], 'email'],
        [['avatar', 'avatarurl', 'avatarUrl', 'avatar_url'], 'avatar_url'],
        [['phone', 'phonenumber', 'phoneNumber', 'phone_number'], 'phone_number'],
        [['company', 'companyname', 'companyName', 'company_name'], 'company_name'],
        [['city'], 'city'],
        [['country', 'countrycode', 'countryCode', 'country_code'], 'country_code'],
        [['description'], 'description'],
        [['identifierhash', 'identifierHash', 'identifier_hash'], 'identifier_hash'],
      ];

      mappings.forEach(function assignValue(entry) {
        var sourceKeys = entry[0];
        var targetKey = entry[1];
        var directValue = readFromParams(params, sourceKeys);
        var metadataValue = readFromObject(
          metadata,
          [targetKey].concat(sourceKeys)
        );

        if (directValue) {
          payload[targetKey] = directValue;
        } else if (metadataValue) {
          payload[targetKey] = metadataValue;
          delete metadata[targetKey];
          sourceKeys.forEach(function cleanup(sourceKey) {
            delete metadata[sourceKey];
          });
        }
      });

      return payload;
    }

    function readFromParams(params, keys) {
      for (var i = 0; i < keys.length; i += 1) {
        var value = params.get(keys[i]);
        if (value) {
          return value;
        }
      }
      return '';
    }

    function readNestedValue(object, keys) {
      var current = object;

      for (var i = 0; i < keys.length; i += 1) {
        if (!current || typeof current !== 'object') {
          return '';
        }

        current = current[keys[i]];
      }

      return current || '';
    }

    function readFromObject(object, keys) {
      for (var i = 0; i < keys.length; i += 1) {
        var value = readNestedValue(object, [keys[i]]);
        if (value) {
          return value;
        }
      }
      return '';
    }

    function normalizeColor(color) {
      if (!color) {
        return '';
      }

      var normalized = String(color).trim();
      if (!normalized) {
        return '';
      }

      if (normalized.charAt(0) === '#') {
        return normalized;
      }

      if (/^[0-9a-fA-F]{3}$/.test(normalized) || /^[0-9a-fA-F]{6}$/.test(normalized)) {
        return '#' + normalized;
      }

      return normalized;
    }

    function showError(message) {
      var error = document.getElementById('error');
      error.textContent = message;
      document.body.dataset.error = 'true';
    }
  </script>
</body>

</html>
